name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site for /portfolio-vel/
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          VITE_ASSET_ORIGIN: https://portfolio-vel.lovable.app
      - name: Prepare dist
        run: |
          echo "--- .output/public ---"
          find .output/public -maxdepth 3 | head -60
          echo "--- dist ---"
          ls -la dist 2>/dev/null || true
          if [ -d dist ] && [ -f dist/index.html ]; then
            echo "using dist"
          elif [ -f .output/public/index.html ]; then
            rm -rf dist && mv .output/public dist
          elif [ -f .output/public/_shell.html ]; then
            rm -rf dist && mv .output/public dist && cp dist/_shell.html dist/index.html
          else
            echo "no index.html found"; exit 1
          fi
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
